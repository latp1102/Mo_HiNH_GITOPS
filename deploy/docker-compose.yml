# Docker Compose cho môi trường LOCAL — mô phỏng kiến trúc Ingress của Kubernetes.
# Lưu ý: KHÔNG xóa volume khi dừng (không có volume dữ liệu ngoài vì backend in-memory).
#
# Cách dùng:
#   docker compose up -d --build
#   Mở http://localhost:30080
#   docker compose logs -f
#   docker compose down          (giữ image, không xóa gì ngoài container)

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: gitops-task-manager-backend:local
    container_name: tmb-backend
    environment:
      - APP_VERSION=1.0.0-compose
      - JAVA_OPTS=-Xms128m -Xmx256m
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: 1.0.0-compose
    image: gitops-task-manager-frontend:local
    container_name: tmb-frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Edge proxy mô phỏng Ingress: route /api -> backend, / -> frontend
  proxy:
    image: nginx:1.27-alpine
    container_name: tmb-proxy
    ports:
      - "30080:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
